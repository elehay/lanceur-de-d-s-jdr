<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche Personnage</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --crimson: #8b1a1a;
  --dark: #0a0806;
  --panel: #13100a;
  --parchment: #f5e6c8;
  --border: rgba(201,168,76,0.22);
}
* { margin:0; padding:0; box-sizing:border-box; }

body {
  min-height: 100vh;
  background: var(--dark);
  background-image:
    radial-gradient(ellipse at 10% 20%, rgba(139,26,26,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 80%, rgba(201,168,76,0.07) 0%, transparent 50%);
  font-family: 'Crimson Text', serif;
  color: var(--parchment);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0 1rem 4rem;
}

/* ── TOP NAV ── */
#topNav {
  width: 100%;
  max-width: 700px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}

.btn-back {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  background: rgba(201,168,76,0.07);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.45rem 0.9rem;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.18s;
}
.btn-back:hover {
  background: rgba(201,168,76,0.15);
  transform: translateX(-2px);
}

/* Char selector in nav */
#charSwitcher {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}
.char-pill {
  width: 34px; height: 34px;
  border-radius: 50%;
  border: 2px solid transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  cursor: pointer;
  transition: all 0.15s;
  opacity: 0.55;
}
.char-pill:hover  { opacity: 0.85; transform: scale(1.1); }
.char-pill.active { border-color: var(--gold); opacity: 1; box-shadow: 0 0 10px rgba(201,168,76,0.3); }

/* ── HEADER ── */
.sheet-header {
  width: 100%;
  max-width: 700px;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  margin-bottom: 2rem;
  animation: fadeUp 0.5s ease both;
}

@keyframes fadeUp {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}

.avatar-circle {
  width: 80px; height: 80px;
  border-radius: 50%;
  border: 2px solid var(--gold);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.2rem;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(201,168,76,0.2);
}

.char-titles { flex: 1; }
.char-titles h1 {
  font-family: 'Cinzel Decorative', serif;
  font-size: clamp(1.1rem, 3.5vw, 1.7rem);
  color: var(--gold);
  text-shadow: 1px 1px 0 var(--crimson);
  margin-bottom: 0.2rem;
}
.char-titles .class-tag {
  font-style: italic;
  color: rgba(245,230,200,0.55);
  font-size: 1rem;
}

/* HP block */
.hp-block {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  background: rgba(139,26,26,0.15);
  border: 1px solid rgba(224,85,85,0.3);
  border-radius: 12px;
  padding: 0.6rem 1rem;
  min-width: 90px;
}
.hp-block .hp-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: rgba(224,85,85,0.7);
  text-transform: uppercase;
}
.hp-block .hp-value {
  font-family: 'Cinzel', serif;
  font-size: 1.5rem;
  color: #e05555;
  line-height: 1;
}
.hp-block .hp-max {
  font-size: 0.8rem;
  color: rgba(245,230,200,0.35);
}

/* ── DIVIDER ── */
.divider {
  width: 100%;
  max-width: 700px;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin-bottom: 1.8rem;
}

/* ── STATS SECTION ── */
.section-title {
  width: 100%;
  max-width: 700px;
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  color: rgba(201,168,76,0.55);
  text-transform: uppercase;
  margin-bottom: 0.9rem;
}

.stats-wheel {
  width: 100%;
  max-width: 700px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 0.75rem;
  margin-bottom: 2rem;
  animation: fadeUp 0.5s 0.1s ease both;
}

.stat-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.9rem 1rem;
  display: flex;
  align-items: center;
  gap: 0.85rem;
  transition: border-color 0.2s, transform 0.15s;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--stat-color);
  border-radius: 3px 0 0 3px;
}
.stat-card:hover {
  border-color: var(--stat-color);
  transform: translateX(3px);
}

/* Hexagon mini icon */
.stat-hex {
  position: relative;
  width: 40px; height: 40px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.stat-hex svg { position: absolute; inset:0; width:100%; height:100%; }
.stat-hex .hex-val {
  position: relative; z-index:2;
  font-family: 'Cinzel', serif;
  font-size: 1rem; font-weight: 700;
  color: rgba(0,0,0,0.85);
  line-height: 1;
}

.stat-info { flex: 1; }
.stat-name-lbl {
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  color: var(--stat-color);
  text-transform: uppercase;
  margin-bottom: 0.2rem;
}

/* Gauge bar */
.stat-gauge {
  height: 4px;
  border-radius: 2px;
  background: rgba(255,255,255,0.07);
  overflow: hidden;
  margin-top: 0.3rem;
}
.stat-gauge-fill {
  height: 100%;
  border-radius: 2px;
  background: var(--stat-color);
  transition: width 0.6s ease;
}

/* ── NOTES SECTION ── */
.notes-area {
  width: 100%;
  max-width: 700px;
  margin-bottom: 2rem;
  animation: fadeUp 0.5s 0.2s ease both;
}

.notes-box {
  width: 100%;
  min-height: 120px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.85rem 1rem;
  color: var(--parchment);
  font-family: 'Crimson Text', serif;
  font-size: 1rem;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  line-height: 1.6;
}
.notes-box:focus { border-color: var(--gold); }
.notes-box::placeholder { color: rgba(245,230,200,0.25); font-style: italic; }

.notes-save-row {
  display: flex;
  justify-content: flex-end;
  margin-top: 0.5rem;
}
.btn-save {
  background: rgba(201,168,76,0.1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.4rem 1rem;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.07em;
  cursor: pointer;
  transition: all 0.18s;
}
.btn-save:hover { background: rgba(201,168,76,0.2); }
.saved-msg {
  font-size: 0.75rem;
  color: #27ae60;
  font-style: italic;
  opacity: 0;
  transition: opacity 0.3s;
  margin-right: 0.7rem;
  align-self: center;
}
.saved-msg.show { opacity: 1; }

/* ── EQUIPMENT SECTION ── */
.equip-list {
  width: 100%;
  max-width: 700px;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  margin-bottom: 2rem;
  animation: fadeUp 0.5s 0.25s ease both;
}

.equip-item {
  background: var(--panel);
  border: 1px solid rgba(201,168,76,0.18);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.2s;
}
.equip-item:focus-within { border-color: rgba(201,168,76,0.4); }

/* Item header row */
.equip-header {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.6rem 0.8rem;
  cursor: pointer;
  user-select: none;
}
.equip-emoji-btn {
  font-size: 1.4rem;
  background: rgba(255,255,255,0.05);
  border: 1px dashed rgba(201,168,76,0.25);
  border-radius: 8px;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: background 0.15s;
  position: relative;
}
.equip-emoji-btn:hover { background: rgba(255,255,255,0.1); }
.equip-name-input {
  flex: 1;
  background: transparent;
  border: none; outline: none;
  color: var(--parchment);
  font-family: 'Cinzel', serif;
  font-size: 0.9rem;
  letter-spacing: 0.04em;
}
.equip-name-input::placeholder { color: rgba(245,230,200,0.25); font-style: italic; font-family: 'Crimson Text', serif; }
.equip-toggle {
  color: rgba(201,168,76,0.4);
  font-size: 0.75rem;
  flex-shrink: 0;
  transition: transform 0.2s;
}
.equip-item.open .equip-toggle { transform: rotate(180deg); }

/* Remove item button */
.equip-remove {
  background: none; border: none;
  color: rgba(224,85,85,0.4); font-size: 1rem;
  cursor: pointer; padding: 0 0.2rem;
  transition: color 0.15s; flex-shrink: 0;
}
.equip-remove:hover { color: #e05555; }

/* Expandable body */
.equip-body {
  display: none;
  padding: 0 0.8rem 0.8rem;
  border-top: 1px solid rgba(201,168,76,0.1);
  flex-direction: column;
  gap: 0.5rem;
}
.equip-item.open .equip-body { display: flex; }

.equip-field-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  color: rgba(201,168,76,0.5);
  text-transform: uppercase;
  margin-bottom: 0.2rem;
  margin-top: 0.4rem;
}
.equip-textarea {
  width: 100%;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 6px;
  padding: 0.4rem 0.6rem;
  color: var(--parchment);
  font-family: 'Crimson Text', serif;
  font-size: 0.9rem;
  resize: vertical;
  min-height: 50px;
  outline: none;
  line-height: 1.5;
  transition: border-color 0.2s;
}
.equip-textarea:focus { border-color: rgba(201,168,76,0.35); }
.equip-textarea::placeholder { color: rgba(245,230,200,0.22); font-style: italic; }

/* Actions list */
.actions-list {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}
.action-row {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.action-name-input {
  flex: 1;
  background: rgba(0,0,0,0.25);
  border: 1px solid rgba(201,168,76,0.12);
  border-radius: 6px;
  padding: 0.3rem 0.55rem;
  color: var(--parchment);
  font-family: 'Crimson Text', serif;
  font-size: 0.88rem;
  outline: none;
  transition: border-color 0.2s;
}
.action-name-input:focus { border-color: rgba(201,168,76,0.35); }
.action-name-input::placeholder { color: rgba(245,230,200,0.22); font-style: italic; }

.action-dice-select {
  background: rgba(0,0,0,0.3);
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 6px;
  padding: 0.3rem 0.4rem;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
  min-width: 62px;
  text-align: center;
}
.action-remove-btn {
  background: none; border: none;
  color: rgba(224,85,85,0.35); font-size: 0.9rem;
  cursor: pointer; padding: 0 2px;
  transition: color 0.15s;
}
.action-remove-btn:hover { color: #e05555; }

.btn-add-action {
  background: rgba(201,168,76,0.07);
  border: 1px dashed rgba(201,168,76,0.25);
  border-radius: 6px;
  padding: 0.28rem 0.7rem;
  color: var(--gold);
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: background 0.15s;
  align-self: flex-start;
}
.btn-add-action:hover { background: rgba(201,168,76,0.15); }

/* Emoji picker */
.emoji-picker-popup {
  position: absolute; top: 100%; left: 0; z-index: 200;
  background: #1a1208;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.5rem;
  display: flex; flex-wrap: wrap;
  width: 200px; gap: 2px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
.emoji-opt {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem; border-radius: 4px; cursor: pointer;
  transition: background 0.1s;
}
.emoji-opt:hover { background: rgba(255,255,255,0.1); }

/* Add item button */
.btn-add-item {
  width: 100%; max-width: 700px;
  background: rgba(201,168,76,0.05);
  border: 1px dashed rgba(201,168,76,0.2);
  border-radius: 10px;
  padding: 0.5rem;
  color: rgba(201,168,76,0.5);
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  letter-spacing: 0.08em;
  cursor: pointer;
  transition: all 0.18s;
  margin-bottom: 2rem;
}
.btn-add-item:hover { background: rgba(201,168,76,0.1); color: var(--gold); border-color: rgba(201,168,76,0.4); }

</style>
</head>
<body>

<!-- TOP NAV -->
<div id="topNav">
  <a class="btn-back" href="game.html">← Retour au plateau</a>
  <div id="charSwitcher"></div>
</div>

<!-- HEADER : avatar + nom + HP -->
<div class="sheet-header">
  <div class="avatar-circle" id="sheetAvatar"></div>
  <div class="char-titles">
    <h1 id="sheetName"></h1>
    <div class="class-tag" id="sheetClass"></div>
  </div>
  <div class="hp-block">
    <span class="hp-label">♥ Vie</span>
    <span class="hp-value" id="sheetHpCur">—</span>
    <span class="hp-max" id="sheetHpMax">/ —</span>
  </div>
</div>

<div class="divider"></div>

<!-- STATS -->
<div class="section-title">Caractéristiques</div>
<div class="stats-wheel" id="statsWheel"></div>

<!-- ÉQUIPEMENT -->
<div class="section-title">Équipement</div>
<div class="equip-list" id="equipList"></div>
<button class="btn-add-item" onclick="addEquipItem()">＋ Ajouter un objet</button>

<!-- NOTES -->
<div class="section-title">Notes & Histoire</div>
<div class="notes-area">
  <textarea class="notes-box" id="notesBox" placeholder="Antécédents, objectifs, secrets, butin…"></textarea>
  <div class="notes-save-row">
    <span class="saved-msg" id="savedMsg">Sauvegardé ✓</span>
    <button class="btn-save" onclick="saveNotes()">Sauvegarder</button>
  </div>
</div>

<script type="module">
import { initializeApp }                    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue }   from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { FIREBASE_CONFIG }                  from "./config.js";

// ── Session ───────────────────────────────────────────────────
let CHARACTERS = JSON.parse(sessionStorage.getItem('characters') || '[]');
const STAT_COLORS = JSON.parse(sessionStorage.getItem('statColors') || '{}');
const isGM = sessionStorage.getItem('isGM') === 'true';
let viewedCharId = sessionStorage.getItem('sheetCharId') || sessionStorage.getItem('charId');
let fbDB = null;

// ── Firebase ──────────────────────────────────────────────────
try {
  const app = initializeApp(FIREBASE_CONFIG);
  fbDB = getDatabase(app);

  // Sync HP from Firebase so sheet reflects live values
  onValue(ref(fbDB, 'session/hp'), snap => {
    const data = snap.val() || {};
    CHARACTERS.forEach(c => {
      if (data[c.id]) {
        c.hp    = data[c.id].current;
        c.hpMax = data[c.id].max;
      }
    });
    // Refresh HP display if we're already showing a sheet
    const hpCurEl = document.getElementById('sheetHpCur');
    const hpMaxEl = document.getElementById('sheetHpMax');
    const cur = CHARACTERS.find(c => c.id === viewedCharId);
    if (hpCurEl && cur) hpCurEl.textContent = cur.hp ?? '?';
    if (hpMaxEl && cur) hpMaxEl.textContent = `/ ${cur.hpMax ?? '?'}`;
  });
} catch(e) {
  console.warn('Firebase unavailable on sheet:', e);
}

// ── GM badge ─────────────────────────────────────────────────
if (isGM) {
  const nav = document.getElementById('topNav');
  const badge = document.createElement('div');
  badge.style.cssText = 'font-family:"Cinzel",serif;font-size:0.72rem;letter-spacing:0.1em;color:#27ae60;background:rgba(39,174,96,0.12);border:1px solid rgba(39,174,96,0.3);border-radius:20px;padding:0.2rem 0.7rem';
  badge.textContent = '🎭 Mode MJ';
  nav.insertBefore(badge, nav.lastElementChild);
}

// ── Build switcher ────────────────────────────────────────────
function buildSwitcher() {
  const sw = document.getElementById('charSwitcher');
  sw.innerHTML = '';
  CHARACTERS.forEach(c => {
    const pill = document.createElement('div');
    pill.className = 'char-pill' + (c.id === viewedCharId ? ' active' : '');
    pill.title = c.name;
    pill.style.background = c.color + '33';
    pill.textContent = c.avatar;
    pill.addEventListener('click', () => {
      viewedCharId = c.id;
      sessionStorage.setItem('sheetCharId', c.id);
      buildSheet();
      buildSwitcher();
    });
    sw.appendChild(pill);
  });
}

// ── Build sheet ───────────────────────────────────────────────
function buildSheet() {
  const char = CHARACTERS.find(c => c.id === viewedCharId);
  if (!char) return;

  document.getElementById('sheetAvatar').textContent = char.avatar;
  document.getElementById('sheetAvatar').style.background = char.color + '33';
  document.getElementById('sheetAvatar').style.borderColor = char.color;
  document.getElementById('sheetName').textContent = char.name;
  document.getElementById('sheetClass').textContent = char.class;

  // HP — editable for GM
  if (isGM) {
    document.getElementById('sheetHpCur').innerHTML =
      `<input id="hpCurInput" type="number" min="0" max="999" value="${char.hp ?? char.hpMax ?? 0}"
        style="width:48px;background:transparent;border:none;border-bottom:1px solid #e05555;color:#e05555;font-family:'Cinzel',serif;font-size:1.4rem;text-align:center;outline:none"
        onchange="saveHp()">`;
    document.getElementById('sheetHpMax').innerHTML =
      `/ <input id="hpMaxInput" type="number" min="0" max="999" value="${char.hpMax ?? 0}"
        style="width:48px;background:transparent;border:none;border-bottom:1px solid rgba(245,230,200,0.3);color:rgba(245,230,200,0.45);font-family:'Cinzel',serif;font-size:0.9rem;text-align:center;outline:none"
        onchange="saveHp()">`;
  } else {
    document.getElementById('sheetHpCur').textContent = char.hp ?? char.hpMax ?? '?';
    document.getElementById('sheetHpMax').textContent = `/ ${char.hpMax ?? '?'}`;
  }

  // Stats
  const wheel = document.getElementById('statsWheel');
  wheel.innerHTML = '';
  Object.entries(char.stats).forEach(([key, val]) => {
    const sc = STAT_COLORS[key] || { color: '#aaa', label: key };
    const pct = Math.round((val / 20) * 100);

    const card = document.createElement('div');
    card.className = 'stat-card';
    card.style.setProperty('--stat-color', sc.color);

    const statContent = isGM
      ? `<input class="stat-edit-input" type="number" min="1" max="30"
           value="${val}" data-stat="${key}"
           style="width:36px;background:rgba(255,255,255,0.12);border:none;border-bottom:2px solid ${sc.color};border-radius:0;color:#fff;font-family:'Cinzel',serif;font-size:1rem;font-weight:700;text-align:center;outline:none;padding:2px;position:relative;z-index:3"
           onchange="saveStats()">`
      : `<span class="hex-val" style="position:relative;z-index:3">${val}</span>`;

    card.innerHTML = `
      <div class="stat-hex">
        <svg viewBox="0 0 40 46" xmlns="http://www.w3.org/2000/svg">
          <polygon points="20,2 38,12 38,34 20,44 2,34 2,12" fill="${sc.color}" opacity="0.9"/>
          <polygon points="20,2 38,12 38,34 20,44 2,34 2,12" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>
        </svg>
        ${statContent}
      </div>
      <div class="stat-info">
        <div class="stat-name-lbl">${sc.label}</div>
        <div class="stat-gauge">
          <div class="stat-gauge-fill" id="gauge_${key}" style="width:${pct}%;background:${sc.color}"></div>
        </div>
      </div>
    `;
    wheel.appendChild(card);
  });

  if (isGM) {
    // Save bar for stats
    let saveBar = document.getElementById('gmSaveBar');
    if (!saveBar) {
      saveBar = document.createElement('div');
      saveBar.id = 'gmSaveBar';
      saveBar.style.cssText = 'width:100%;max-width:700px;display:flex;justify-content:flex-end;gap:0.6rem;align-items:center;margin-bottom:1rem';
      saveBar.innerHTML = `
        <span id="statSavedMsg" style="font-size:0.75rem;color:#27ae60;font-style:italic;opacity:0;transition:opacity 0.3s">Sauvegardé ✓</span>
        <button onclick="saveStats(true)"
          style="background:rgba(39,174,96,0.15);border:1px solid rgba(39,174,96,0.4);border-radius:8px;padding:0.4rem 1rem;color:#27ae60;font-family:'Cinzel',serif;font-size:0.72rem;letter-spacing:0.07em;cursor:pointer">
          💾 Sauvegarder les stats
        </button>`;
      wheel.after(saveBar);
    }
  }

  // Equipment
  buildEquipList(char.id);

  const notes = localStorage.getItem(`notes_${char.id}`) || '';
  document.getElementById('notesBox').value = notes;
  document.getElementById('notesBox').dataset.charId = char.id;

  document.title = `Fiche — ${char.name}`;
}

// ════════════════════════════════════════════════════════════
//  EQUIPMENT SYSTEM
// ════════════════════════════════════════════════════════════
const DICE_OPTIONS = ['D4','D6','D8','D10','D12','D20','D100','2D6','2D8','3D6'];
const EMOJI_OPTIONS = ['⚔️','🗡️','🛡️','🪖','👟','💍','🎒','✨','🏹','🔮','📜','🧪','🪄','🔱','⚡','🔥','❄️','🌿','💀','🩸','🪬','🧲','🔔','🪙','💎'];

function loadEquip(charId) {
  return JSON.parse(localStorage.getItem(`equip2_${charId}`) || '[]');
}

function saveEquipData(charId) {
  const items = [];
  document.querySelectorAll('.equip-item').forEach(card => {
    items.push({
      emoji:       card.dataset.emoji || '⚔️',
      name:        card.querySelector('.equip-name-input')?.value || '',
      description: card.querySelector('.equip-desc')?.value || '',
      effects:     card.querySelector('.equip-effects')?.value || '',
      actions:     Array.from(card.querySelectorAll('.action-row')).map(row => ({
        name: row.querySelector('.action-name-input')?.value || '',
        dice: row.querySelector('.action-dice-select')?.value || 'D20',
      }))
    });
  });
  localStorage.setItem(`equip2_${charId}`, JSON.stringify(items));
  const msg = document.getElementById('savedMsg');
  if (msg) { msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 1500); }
}

function buildEquipList(charId) {
  const list = document.getElementById('equipList');
  list.innerHTML = '';
  const items = loadEquip(charId);
  items.forEach(item => addEquipItemFromData(charId, item));
}

window.addEquipItem = function() {
  const charId = viewedCharId;
  addEquipItemFromData(charId, { emoji:'⚔️', name:'', description:'', effects:'', actions:[] });
  saveEquipData(charId);
};

function addEquipItemFromData(charId, item) {
  const list = document.getElementById('equipList');
  const card = document.createElement('div');
  card.className = 'equip-item';
  card.dataset.emoji = item.emoji || '⚔️';

  // Build actions HTML
  const actionsHTML = (item.actions || []).map((a, i) => buildActionRowHTML(a.name, a.dice)).join('');
  const diceOptsHTML = DICE_OPTIONS.map(d => `<option value="${d}">${d}</option>`).join('');

  card.innerHTML = `
    <div class="equip-header">
      <div class="equip-emoji-btn" title="Changer l'icône">${item.emoji || '⚔️'}</div>
      <input class="equip-name-input" type="text" placeholder="Nom de l'objet…" value="${(item.name||'').replace(/"/g,'&quot;')}">
      <button class="equip-remove" title="Supprimer">✕</button>
      <span class="equip-toggle">▾</span>
    </div>
    <div class="equip-body">
      <div class="equip-field-label">Description</div>
      <textarea class="equip-textarea equip-desc" placeholder="Apparence, origine, matériau…" rows="2">${item.description||''}</textarea>
      <div class="equip-field-label">Effets</div>
      <textarea class="equip-textarea equip-effects" placeholder="Bonus, malus, effets magiques…" rows="2">${item.effects||''}</textarea>
      <div class="equip-field-label">Actions</div>
      <div class="actions-list">${actionsHTML}</div>
      <button class="btn-add-action">＋ Action</button>
    </div>
  `;

  // Toggle open/close
  card.querySelector('.equip-header').addEventListener('click', e => {
    if (e.target.classList.contains('equip-remove')) return;
    if (e.target.classList.contains('equip-emoji-btn') || e.target.closest('.equip-emoji-btn')) return;
    card.classList.toggle('open');
  });

  // Remove item
  card.querySelector('.equip-remove').addEventListener('click', e => {
    e.stopPropagation();
    card.remove();
    saveEquipData(charId);
  });

  // Emoji picker
  const emojiBtn = card.querySelector('.equip-emoji-btn');
  emojiBtn.addEventListener('click', e => {
    e.stopPropagation();
    // Close any open pickers
    document.querySelectorAll('.emoji-picker-popup').forEach(p => p.remove());
    const picker = document.createElement('div');
    picker.className = 'emoji-picker-popup';
    EMOJI_OPTIONS.forEach(em => {
      const opt = document.createElement('div');
      opt.className = 'emoji-opt';
      opt.textContent = em;
      opt.addEventListener('click', ev => {
        ev.stopPropagation();
        emojiBtn.textContent = em;
        card.dataset.emoji = em;
        picker.remove();
        saveEquipData(charId);
      });
      picker.appendChild(opt);
    });
    emojiBtn.appendChild(picker);
    // Close on outside click
    setTimeout(() => document.addEventListener('click', () => picker.remove(), { once: true }), 10);
  });

  // Add action button
  card.querySelector('.btn-add-action').addEventListener('click', e => {
    e.stopPropagation();
    const actionsList = card.querySelector('.actions-list');
    const row = document.createElement('div');
    row.className = 'action-row';
    row.innerHTML = buildActionRowHTML('', 'D20');
    actionsList.appendChild(row);
    row.querySelector('.action-remove-btn').addEventListener('click', () => { row.remove(); saveEquipData(charId); });
    row.querySelector('.action-name-input').addEventListener('input', () => saveEquipData(charId));
    row.querySelector('.action-dice-select').addEventListener('change', () => saveEquipData(charId));
  });

  // Wire existing action remove buttons
  card.querySelectorAll('.action-remove-btn').forEach(btn => {
    btn.addEventListener('click', () => { btn.closest('.action-row').remove(); saveEquipData(charId); });
  });

  // Auto-save on any input change inside the card
  card.addEventListener('input', () => saveEquipData(charId));
  card.addEventListener('change', () => saveEquipData(charId));

  list.appendChild(card);
}

function buildActionRowHTML(name, dice) {
  const diceOptsHTML = DICE_OPTIONS.map(d => `<option value="${d}"${d===dice?' selected':''}>${d}</option>`).join('');
  return `<div class="action-row">
    <input class="action-name-input" type="text" placeholder="Nom de l'action…" value="${(name||'').replace(/"/g,'&quot;')}">
    <select class="action-dice-select">${diceOptsHTML}</select>
    <button class="action-remove-btn" type="button">✕</button>
  </div>`;
}

// ── GM: save stats to Firebase ────────────────────────────────
window.saveStats = function(explicit = false) {
  const char = CHARACTERS.find(c => c.id === viewedCharId);
  if (!char || !isGM) return;

  document.querySelectorAll('.stat-edit-input').forEach(input => {
    const key = input.dataset.stat;
    const val = Math.max(1, Math.min(30, parseInt(input.value) || 1));
    char.stats[key] = val;
    const gauge = document.getElementById(`gauge_${key}`);
    if (gauge) gauge.style.width = Math.round((val / 20) * 100) + '%';
  });

  sessionStorage.setItem('characters', JSON.stringify(CHARACTERS));

  // Push ALL stats of this char to Firebase so all clients receive the update
  if (fbDB) {
    set(ref(fbDB, `session/chars/${char.id}/stats`), { ...char.stats });
  }

  if (explicit) {
    const msg = document.getElementById('statSavedMsg');
    if (msg) { msg.style.opacity = '1'; setTimeout(() => msg.style.opacity = '0', 2000); }
  }
};

// Auto-save on every keystroke (debounced 600ms)
document.addEventListener('input', e => {
  if (e.target.classList.contains('stat-edit-input')) {
    clearTimeout(window._statSaveTimer);
    window._statSaveTimer = setTimeout(() => saveStats(false), 600);
  }
});

// ── GM: save HP to Firebase ───────────────────────────────────
window.saveHp = function() {
  const char = CHARACTERS.find(c => c.id === viewedCharId);
  if (!char || !isGM) return;
  const cur = parseInt(document.getElementById('hpCurInput')?.value) ?? char.hp;
  const max = parseInt(document.getElementById('hpMaxInput')?.value) ?? char.hpMax;
  char.hp = cur; char.hpMax = max;
  sessionStorage.setItem('characters', JSON.stringify(CHARACTERS));
  if (fbDB) set(ref(fbDB, `session/hp/${char.id}`), { current: cur, max });
};

// ── Save notes ────────────────────────────────────────────────
window.saveNotes = function() {
  const box = document.getElementById('notesBox');
  const cid = box.dataset.charId || viewedCharId;
  localStorage.setItem(`notes_${cid}`, box.value);
  const msg = document.getElementById('savedMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
};

let saveTimer;
document.getElementById('notesBox').addEventListener('input', () => {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNotes, 1200);
});

// ── Init ──────────────────────────────────────────────────────
if (!CHARACTERS.length) {
  document.body.innerHTML = `<div style="text-align:center;padding:4rem;font-family:'Cinzel Decorative',serif;color:#c9a84c">
    <div style="font-size:2rem">⚔️</div>
    <div style="margin:1rem 0">Session expirée</div>
    <a href="index.html" style="color:#f0d080;font-family:'Crimson Text',serif;font-style:italic">→ Retourner à la taverne</a>
  </div>`;
} else {
  if (!CHARACTERS.find(c => c.id === viewedCharId)) viewedCharId = CHARACTERS[0].id;
  buildSwitcher();
  buildSheet();
}
</script>
