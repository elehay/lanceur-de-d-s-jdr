<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plateau de Jeu</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<!-- Firebase SDK (compat mode = pas de "import", fonctionne partout) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
:root {
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --crimson: #8b1a1a;
  --dark: #0a0806;
  --panel: rgba(13,10,7,0.93);
  --parchment: #f5e6c8;
  --border: rgba(201,168,76,0.22);
  --hud-h: 130px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }

body {
  background: #000;
  font-family: 'Crimson Text', serif;
  color: var(--parchment);
  display: flex;
  flex-direction: column;
}

/* ── TOP BAR ── */
#topBar {
  height: 52px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.2rem;
  flex-shrink: 0;
  z-index: 20;
  gap: 1rem;
}
#topBar .title {
  font-family: 'Cinzel Decorative', serif;
  font-size: 0.8rem;
  color: var(--gold);
  letter-spacing: 0.08em;
  white-space: nowrap;
}
.player-chip {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.25rem 0.7rem 0.25rem 0.4rem;
  font-size: 0.82rem;
}
.player-chip .avatar { font-size: 1.1rem; }
.player-chip .pname  { color: var(--gold-light); font-family:'Cinzel',serif; font-size:0.78rem; }
.player-chip .hp-bar {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  margin-left: 0.3rem;
  padding-left: 0.5rem;
  border-left: 1px solid var(--border);
  font-size: 0.8rem;
}
.hp-icon { color: #e05555; font-size: 0.8rem; }
.hp-text { font-family:'Cinzel',serif; font-size:0.78rem; color:#ccc; }
.hp-text .cur { color:#f5e6c8; }
.hp-text .max { color:rgba(245,230,200,0.45); }

/* ── SHEET PILLS ── */
.sheet-pills { display:flex; align-items:center; gap:0.35rem; flex-shrink:0; }
.sheet-pill {
  width: 30px; height: 30px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
  opacity: 0.6;
  position: relative;
}
.sheet-pill:hover  { opacity:1; transform:scale(1.12); border-color:var(--gold); }
.sheet-pill.self   { opacity:1; border-color:var(--gold); box-shadow:0 0 8px rgba(201,168,76,0.35); }
.sheet-pill-tip {
  position: absolute; bottom:-20px; left:50%; transform:translateX(-50%);
  background: rgba(0,0,0,0.88); color:var(--parchment);
  font-size: 0.52rem; font-family:'Cinzel',serif;
  white-space:nowrap; padding:2px 5px; border-radius:4px;
  pointer-events:none; opacity:0; transition:opacity 0.15s;
}
.sheet-pill:hover .sheet-pill-tip { opacity:1; }

/* connection badge */
#connStatus {
  flex-shrink: 0;
  font-size: 0.7rem;
  font-family: 'Cinzel', serif;
  padding: 0.2rem 0.55rem;
  border-radius: 20px;
  white-space: nowrap;
}
#connStatus.ok   { background:rgba(39,174,96,0.2);  color:#2ecc71; border:1px solid rgba(39,174,96,0.3); }
#connStatus.err  { background:rgba(231,76,60,0.2);  color:#e74c3c; border:1px solid rgba(231,76,60,0.3); }
#connStatus.demo { background:rgba(243,156,18,0.2); color:#f39c12; border:1px solid rgba(243,156,18,0.3); }

/* ── BOARD ── */
#boardWrapper {
  flex: 1;
  position: relative;
  overflow: hidden;
}
#boardImg {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  background: linear-gradient(135deg, #1a1208, #0a0806);
}

/* ── PIONS ── */
.pion {
  position: absolute;
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
  cursor: default;
  transform: translate(-50%, -50%);
  z-index: 5;
  box-shadow: 0 4px 14px rgba(0,0,0,0.7);
  transition: transform 0.12s;
  user-select: none;
}
.pion.mine { cursor: grab; }
.pion.mine:hover { transform: translate(-50%,-50%) scale(1.12); }
.pion.mine:active { cursor: grabbing; }

.pion-info {
  position: absolute;
  top: calc(100% + 4px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  pointer-events: none;
  white-space: nowrap;
}
.pion-name {
  font-family: 'Cinzel', serif;
  font-size: 0.58rem;
  color: #fff;
  text-shadow: 0 1px 4px #000, 0 0 8px #000;
}
.pion-hp {
  font-family: 'Cinzel', serif;
  font-size: 0.55rem;
  color: #e05555;
  text-shadow: 0 1px 3px #000;
  margin-top: 1px;
}

/* ── FLOATING DICE (hexagone SVG) ── */
.die-wrapper {
  position: absolute;
  z-index: 10;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.die-hex {
  position: relative;
  width: 54px;
  height: 54px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.die-hex svg.hex-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
}

.die-hex .die-val {
  position: relative;
  z-index: 2;
  font-family: 'Cinzel', serif;
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1;
}

.die-owner-lbl {
  font-size: 0.48rem;
  font-family: 'Cinzel', serif;
  color: rgba(255,255,255,0.7);
  text-shadow: 0 1px 3px #000;
  margin-top: 2px;
  white-space: nowrap;
}

/* Travel animation: die flies from HUD to final position */
@keyframes dieFly {
  0%   { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(-180deg); }
  40%  { opacity: 1; transform: translate(calc(var(--dx)*0.1), calc(var(--dy)*0.1)) scale(1.15) rotate(320deg); }
  65%  { transform: translate(0, -12px) scale(0.92) rotate(355deg); }
  82%  { transform: translate(0, 6px) scale(1.04) rotate(360deg); }
  100% { opacity: 1; transform: translate(0, 0) scale(1) rotate(360deg); }
}

.die-wrapper.flying .die-hex {
  animation: dieFly 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* Success / failure glow on hex */
.die-hex.success svg.hex-bg { filter: drop-shadow(0 0 8px rgba(255,220,60,0.9)) drop-shadow(0 4px 8px rgba(0,0,0,0.7)); }
.die-hex.failure svg.hex-bg { filter: drop-shadow(0 0 8px rgba(230,60,60,0.9))  drop-shadow(0 4px 8px rgba(0,0,0,0.7)); }

/* ── BOTTOM HUD ── */
#hud {
  height: var(--hud-h);
  background: var(--panel);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0 1rem;
  overflow-x: auto;
  overflow-y: hidden;
  z-index: 20;
}
#hud::-webkit-scrollbar { height: 3px; }
#hud::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 2px; }

.stat-btn {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.28rem;
  background: rgba(0,0,0,0.35);
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.08);
  padding: 0.5rem 0.7rem;
  cursor: pointer;
  transition: all 0.16s;
  min-width: 68px;
  position: relative;
  overflow: hidden;
}
.stat-btn::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--btn-color);
  opacity: 0.1;
  transition: opacity 0.16s;
}
.stat-btn:hover::before { opacity: 0.22; }
.stat-btn:hover { transform: translateY(-3px); border-color: var(--btn-color); }
.stat-btn:active { transform: scale(0.95); }

/* Mini hexagon inside button */
.btn-hex {
  position: relative;
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
}
.btn-hex svg { position:absolute; inset:0; width:100%; height:100%; }
.btn-hex .btn-d20 {
  position: relative;
  z-index: 2;
  font-family: 'Cinzel', serif;
  font-size: 0.72rem;
  font-weight: 700;
  color: rgba(0,0,0,0.85);
  line-height: 1;
}

.stat-label {
  font-family: 'Cinzel', serif;
  font-size: 0.58rem;
  letter-spacing: 0.05em;
  color: var(--btn-color);
  text-transform: uppercase;
}
.stat-score {
  font-size: 0.72rem;
  color: rgba(245,230,200,0.5);
  font-style: italic;
}

.hud-sep { width:1px; height:65px; background:var(--border); flex-shrink:0; }

.btn-clear {
  flex-shrink: 0;
  display: flex; flex-direction: column; align-items: center; gap: 0.3rem;
  background: rgba(139,26,26,0.18);
  border: 1px solid rgba(139,26,26,0.4);
  border-radius: 12px;
  padding: 0.55rem 0.9rem;
  cursor: pointer;
  transition: all 0.16s;
  color: #e05555;
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  min-width: 68px;
}
.btn-clear:hover { background: rgba(139,26,26,0.38); transform: translateY(-3px); }
.btn-clear .icon { font-size: 1.3rem; }

#lastRollInfo {
  flex-shrink: 0;
  min-width: 100px;
  max-width: 130px;
  text-align: center;
  font-style: italic;
  font-size: 0.82rem;
  color: rgba(245,230,200,0.4);
  line-height: 1.4;
  padding: 0 0.4rem;
}

/* Login guard */
#loginBlock {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.96);
  display: none;
  align-items: center; justify-content: center;
  z-index: 999;
  flex-direction: column; gap: 1rem;
  font-family: 'Cinzel Decorative', serif;
  font-size: 1.1rem; color: var(--gold); text-align: center;
}
</style>
</head>
<body>

<div id="loginBlock">
  <div>⚔️</div>
  <div>Vous n'êtes pas connecté.</div>
  <a href="index.html" style="font-size:0.85rem;color:var(--gold-light);font-family:'Crimson Text',serif;font-style:italic">→ Retourner à la taverne</a>
</div>

<!-- TOP BAR -->
<div id="topBar">
  <div class="title">⚔️ Plateau de Jeu</div>
  <div id="playerChip" class="player-chip"></div>
  <!-- Fiche personnage : un bouton par perso -->
  <div class="sheet-pills" id="sheetPills"></div>
  <div id="connStatus" class="demo">⚡ Local</div>
</div>

<!-- BOARD -->
<div id="boardWrapper">
  <!--
    IMAGE DU PLATEAU :
    Option A — fichier local : <img id="boardImg" src="map.jpg" alt="plateau">
    Option B — URL           : <img id="boardImg" src="https://..." alt="plateau">
    Option C — MJ via Firebase: mettre l'URL dans session/boardImage dans la DB
  -->
  <img id="boardImg" src="" alt="plateau">
</div>

<!-- HUD -->
<div id="hud">
  <div id="lastRollInfo">Lance un dé…</div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  FIREBASE CONFIG
//  ⚠️  Remplace ces valeurs par ta config Firebase
//  (Console Firebase → Paramètres projet → Vos applications)
// ════════════════════════════════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey:            "VOTRE_API_KEY",
  authDomain:        "VOTRE_PROJECT.firebaseapp.com",
  databaseURL:       "https://VOTRE_PROJECT-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "VOTRE_PROJECT",
  storageBucket:     "VOTRE_PROJECT.appspot.com",
  messagingSenderId: "VOTRE_SENDER_ID",
  appId:             "VOTRE_APP_ID"
};
// ════════════════════════════════════════════════════════════

// ── Session ──────────────────────────────────────────────────
const playerName = sessionStorage.getItem('playerName');
const charId     = sessionStorage.getItem('charId');
const CHARACTERS = JSON.parse(sessionStorage.getItem('characters') || '[]');
const STAT_COLORS= JSON.parse(sessionStorage.getItem('statColors') || '{}');

if (!playerName || !charId || !CHARACTERS.length) {
  document.getElementById('loginBlock').style.display = 'flex';
}

const myChar = CHARACTERS.find(c => c.id === charId) || {};

// ── Positions initiales pions (% plateau) ────────────────────
const PION_POSITIONS = {
  thorin:  { x: 30, y: 50 },
  elawyn:  { x: 50, y: 30 },
  mira:    { x: 70, y: 60 },
  balgar:  { x: 40, y: 70 },
};

// ── HP en mémoire (sync Firebase si dispo) ───────────────────
// hp et hpMax peuvent venir de myChar.hp / myChar.hpMax dans index.html
let hpData = {}; // { charId: { current, max } }
CHARACTERS.forEach(c => {
  hpData[c.id] = { current: c.hp ?? c.hpMax ?? 20, max: c.hpMax ?? 20 };
});

// ── State ────────────────────────────────────────────────────
let diceOnBoard = {};
let useFirebase = false;
let fbDB = null;

// ════════════════════════════════════════════════════════════
//  TOP BAR : player chip avec PV
// ════════════════════════════════════════════════════════════
function buildPlayerChip() {
  const hp  = hpData[charId] || { current: '?', max: '?' };
  document.getElementById('playerChip').innerHTML = `
    <span class="avatar">${myChar.avatar || '⚔️'}</span>
    <span class="pname">${myChar.name || playerName}</span>
    <span class="hp-bar">
      <span class="hp-icon">♥</span>
      <span class="hp-text">
        <span class="cur" id="topHpCur">${hp.current}</span>
        <span class="max"> / ${hp.max}</span>
      </span>
    </span>
  `;
}

// ════════════════════════════════════════════════════════════
//  PIONS
// ════════════════════════════════════════════════════════════
function renderPions(positions) {
  document.querySelectorAll('.pion').forEach(el => el.remove());

  CHARACTERS.forEach(char => {
    const pos = (positions && positions[char.id]) || PION_POSITIONS[char.id] || { x:50, y:50 };
    const board = document.getElementById('boardWrapper');
    const bw = board.clientWidth  || 800;
    const bh = board.clientHeight || 600;
    const px = (pos.x / 100) * bw;
    const py = (pos.y / 100) * bh;
    const hp = hpData[char.id] || { current:'?', max:'?' };

    const pion = document.createElement('div');
    pion.className = 'pion' + (char.id === charId ? ' mine' : '');
    pion.id = `pion_${char.id}`;
    pion.style.cssText = `left:${px}px; top:${py}px; background:${char.color};`;
    pion.innerHTML = `
      ${char.avatar}
      <div class="pion-info">
        <span class="pion-name">${char.name.split(' ')[0]}</span>
        <span class="pion-hp" id="pionHp_${char.id}">♥ ${hp.current}/${hp.max}</span>
      </div>
    `;

    if (char.id === charId) makeDraggable(pion, char.id);
    board.appendChild(pion);
  });
}

function updateHpDisplay(cid, current, max) {
  // Pion label
  const pionHpEl = document.getElementById(`pionHp_${cid}`);
  if (pionHpEl) pionHpEl.textContent = `♥ ${current}/${max}`;
  // Top bar (own char)
  if (cid === charId) {
    const topEl = document.getElementById('topHpCur');
    if (topEl) topEl.textContent = current;
  }
}

// ════════════════════════════════════════════════════════════
//  HUD
// ════════════════════════════════════════════════════════════
function buildHud() {
  const hud = document.getElementById('hud');
  hud.innerHTML = '';

  if (!myChar.stats) return;

  Object.entries(myChar.stats).forEach(([key, val]) => {
    const sc = STAT_COLORS[key] || { color:'#aaa', label:key };
    const btn = document.createElement('button');
    btn.className = 'stat-btn';
    btn.style.setProperty('--btn-color', sc.color);
    btn.title = `D20 — ${sc.label} (seuil: ${val})`;

    // Hexagon SVG for button
    btn.innerHTML = `
      <div class="btn-hex">
        <svg viewBox="0 0 40 46" xmlns="http://www.w3.org/2000/svg">
          <polygon points="20,2 38,12 38,34 20,44 2,34 2,12"
                   fill="${sc.color}" opacity="0.9"/>
          <polygon points="20,2 38,12 38,34 20,44 2,34 2,12"
                   fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
        </svg>
        <span class="btn-d20">D20</span>
      </div>
      <span class="stat-label">${sc.label}</span>
      <span class="stat-score">${val}</span>
    `;
    btn.addEventListener('click', () => rollStat(key, sc.color, sc.label, val));
    hud.appendChild(btn);
  });

  const sep = document.createElement('div');
  sep.className = 'hud-sep';
  hud.appendChild(sep);

  const clr = document.createElement('button');
  clr.className = 'btn-clear';
  clr.innerHTML = `<div class="icon">🧹</div><div>Fin d'action</div>`;
  clr.addEventListener('click', clearAllDice);
  hud.appendChild(clr);

  const info = document.createElement('div');
  info.id = 'lastRollInfo';
  info.textContent = 'Lance un dé…';
  hud.appendChild(info);
}

// ════════════════════════════════════════════════════════════
//  DICE ROLLING
// ════════════════════════════════════════════════════════════
function rollStat(statKey, color, label, score) {
  const value = Math.floor(Math.random() * 20) + 1;
  const dieId = `die_${Date.now()}_${Math.random().toString(36).slice(2,6)}`;

  const board  = document.getElementById('boardWrapper');
  const bw = board.clientWidth;
  const bh = board.clientHeight;
  const margin = 70;
  const x = margin + Math.random() * (bw - margin * 2);
  const y = margin + Math.random() * (bh - margin * 2);

  const success = value <= score;

  const dieData = {
    id: dieId, x, y, value,
    stat: statKey, label, color, score,
    success,
    owner: playerName,
    char:  myChar.name || '',
    ts:    Date.now()
  };

  if (useFirebase) {
    pushDieFirebase(dieData);
  } else {
    diceOnBoard[dieId] = dieData;
    renderDie(dieData, true);
  }

  // Update last roll info
  const info = document.getElementById('lastRollInfo');
  if (info) {
    info.innerHTML = `
      <span style="color:${color};font-family:'Cinzel',serif;font-size:0.85rem">${label}</span><br>
      <span style="font-size:1.3rem;color:${success?'#f0d080':'#e05555'};font-family:'Cinzel',serif">${value}</span><br>
      <span style="font-size:0.72rem;color:${success?'#f0d080':'#e05555'}">${success ? '✦ Réussi' : '✗ Échec'} (/ ${score})</span>
    `;
  }
}

// ── Build hexagon SVG ─────────────────────────────────────────
function hexSVG(fillColor, strokeColor) {
  return `<svg class="hex-bg" viewBox="0 0 54 62" xmlns="http://www.w3.org/2000/svg">
    <polygon points="27,2 52,15.5 52,46.5 27,60 2,46.5 2,15.5"
             fill="${fillColor}" opacity="0.93"/>
    <polygon points="27,2 52,15.5 52,46.5 27,60 2,46.5 2,15.5"
             fill="none" stroke="${strokeColor}" stroke-width="2.5"/>
  </svg>`;
}

// ── Render a die ──────────────────────────────────────────────
function renderDie(die, animate = false) {
  const old = document.getElementById(die.id);
  if (old) old.remove();

  const success = die.success; // boolean
  const strokeColor = success ? 'rgba(255,220,60,0.95)' : 'rgba(230,60,60,0.95)';
  const textColor   = getContrastColor(die.color);

  const wrapper = document.createElement('div');
  wrapper.className = 'die-wrapper';
  wrapper.id = die.id;
  wrapper.style.cssText = `left:${die.x}px; top:${die.y}px; transform:translate(-50%,-50%);`;

  const hex = document.createElement('div');
  hex.className = 'die-hex' + (success ? ' success' : ' failure');
  hex.innerHTML = `
    ${hexSVG(die.color, strokeColor)}
    <span class="die-val" style="color:${textColor}">${die.value}</span>
  `;

  const ownerLbl = document.createElement('div');
  ownerLbl.className = 'die-owner-lbl';
  ownerLbl.textContent = die.owner;

  wrapper.appendChild(hex);
  wrapper.appendChild(ownerLbl);

  if (animate) {
    // Compute travel vector from HUD center to die target position
    const board  = document.getElementById('boardWrapper');
    const bw = board.clientWidth, bh = board.clientHeight;
    const hudH   = 130;
    const originX = bw / 2;
    const originY = bh + hudH / 2;
    const dx = originX - die.x;
    const dy = originY - die.y;
    hex.style.setProperty('--dx', dx + 'px');
    hex.style.setProperty('--dy', dy + 'px');
    wrapper.classList.add('flying');
    wrapper.addEventListener('animationend', () => wrapper.classList.remove('flying'), { once: true });
  }

  document.getElementById('boardWrapper').appendChild(wrapper);
}

// ── Clear all dice ────────────────────────────────────────────
function clearAllDice() {
  if (useFirebase) {
    fbDB.ref('session/dice').remove();
  } else {
    diceOnBoard = {};
    document.querySelectorAll('.die-wrapper').forEach(el => el.remove());
  }
  const info = document.getElementById('lastRollInfo');
  if (info) info.textContent = 'Lance un dé…';
}

// ── Drag pion ─────────────────────────────────────────────────
function makeDraggable(el, cid) {
  let dragging = false, sx, sy, ox, oy;

  el.addEventListener('mousedown', e => {
    dragging = true;
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    el.style.left = (ox + e.clientX - sx) + 'px';
    el.style.top  = (oy + e.clientY - sy) + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    if (useFirebase) {
      const board = document.getElementById('boardWrapper');
      const nx = parseFloat(el.style.left) / board.clientWidth  * 100;
      const ny = parseFloat(el.style.top)  / board.clientHeight * 100;
      fbDB.ref(`session/pions/${cid}`).set({ x: nx, y: ny });
    }
  });
}

// ── Contrast helper ───────────────────────────────────────────
function getContrastColor(hex) {
  if (!hex || hex[0] !== '#') return '#000';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 145 ? '#111' : '#fff';
}

// ════════════════════════════════════════════════════════════
//  FIREBASE INIT
// ════════════════════════════════════════════════════════════
function initFirebase() {
  // Detect placeholder config — skip if not filled
  if (FIREBASE_CONFIG.apiKey === 'VOTRE_API_KEY') {
    showDemoMode(); return;
  }

  try {
    const app = firebase.initializeApp(FIREBASE_CONFIG);
    fbDB = firebase.database();

    useFirebase = true;
    document.getElementById('connStatus').className = 'ok';
    document.getElementById('connStatus').textContent = '● Connecté';

    // ── Dice sync ──
    fbDB.ref('session/dice').on('value', snap => {
      document.querySelectorAll('.die-wrapper').forEach(el => el.remove());
      const data = snap.val() || {};
      diceOnBoard = data;
      Object.values(data).forEach(die => renderDie(die, false));
    });

    // ── Pion sync ──
    fbDB.ref('session/pions').on('value', snap => {
      renderPions(snap.val() || {});
    });

    // ── HP sync ──
    fbDB.ref('session/hp').on('value', snap => {
      const data = snap.val() || {};
      Object.entries(data).forEach(([cid, hp]) => {
        hpData[cid] = hp;
        updateHpDisplay(cid, hp.current, hp.max);
      });
    });

    // ── Board image sync ──
    fbDB.ref('session/boardImage').on('value', snap => {
      const url = snap.val();
      if (url) document.getElementById('boardImg').src = url;
    });

    // ── Register own pion position ──
    const myPos = PION_POSITIONS[charId] || { x:50, y:50 };
    fbDB.ref(`session/pions/${charId}`).once('value', snap => {
      if (!snap.exists()) fbDB.ref(`session/pions/${charId}`).set(myPos);
    });

    // ── Register own HP if not exists ──
    fbDB.ref(`session/hp/${charId}`).once('value', snap => {
      if (!snap.exists()) {
        const hp = hpData[charId];
        fbDB.ref(`session/hp/${charId}`).set(hp);
      }
    });

  } catch(e) {
    console.warn('Firebase error:', e);
    showDemoMode();
  }
}

function pushDieFirebase(die) {
  fbDB.ref(`session/dice/${die.id}`).set(die);
}

function showDemoMode() {
  useFirebase = false;
  document.getElementById('connStatus').className = 'demo';
  document.getElementById('connStatus').textContent = '⚡ Mode local';
  renderPions({});
}

// ════════════════════════════════════════════════════════════
//  SHEET PILLS  — un bouton par personnage vers sheet.html
// ════════════════════════════════════════════════════════════
function buildSheetPills() {
  const container = document.getElementById('sheetPills');
  if (!container || !CHARACTERS.length) return;
  container.innerHTML = '';
  CHARACTERS.forEach(char => {
    const pill = document.createElement('a');
    pill.className = 'sheet-pill' + (char.id === charId ? ' self' : '');
    pill.style.background = char.color + '2a';
    pill.style.borderColor = char.id === charId ? char.color : 'rgba(255,255,255,0.18)';
    pill.href = 'sheet.html';
    pill.title = char.name;
    pill.innerHTML = `${char.avatar}<span class="sheet-pill-tip">${char.name.split(' ')[0]}</span>`;
    // Store which char to show on sheet.html
    pill.addEventListener('click', () => {
      sessionStorage.setItem('sheetCharId', char.id);
    });
    container.appendChild(pill);
  });
}

// ════════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════════
buildPlayerChip();
buildSheetPills();
buildHud();
initFirebase();

window.addEventListener('load',   () => { if (!useFirebase) renderPions({}); });
window.addEventListener('resize', () => { if (!useFirebase) renderPions({}); else renderPions({}); });
</script>
