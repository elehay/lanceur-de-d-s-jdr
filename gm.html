<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tableau de Bord — MJ</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --green: #27ae60;
  --dark: #080906;
  --panel: rgba(10,12,8,0.93);
  --parchment: #f5e6c8;
  --border: rgba(39,174,96,0.2);
  --hud-h: 150px;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }

body {
  background:#000;
  font-family:'Crimson Text',serif;
  color:var(--parchment);
  display:flex; flex-direction:column;
}

/* ── TOP BAR ── */
#topBar {
  height: 52px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 1rem; gap: 0.8rem;
  flex-shrink: 0; z-index:20;
}
.gm-title {
  font-family:'Cinzel Decorative',serif;
  font-size:0.8rem; color:#27ae60;
  letter-spacing:0.08em; white-space:nowrap;
}
.gm-badge {
  background:rgba(39,174,96,0.12);
  border:1px solid rgba(39,174,96,0.35);
  border-radius:20px; padding:0.18rem 0.65rem;
  font-family:'Cinzel',serif; font-size:0.7rem;
  color:#27ae60; white-space:nowrap;
}
.top-sep { flex:1; }

.btn-top {
  background:rgba(201,168,76,0.07);
  border:1px solid rgba(201,168,76,0.25);
  border-radius:8px; padding:0.35rem 0.8rem;
  color:var(--gold); font-family:'Cinzel',serif;
  font-size:0.7rem; letter-spacing:0.06em;
  cursor:pointer; text-decoration:none;
  transition:all 0.15s; white-space:nowrap;
}
.btn-top:hover { background:rgba(201,168,76,0.15); }

/* ── LAYOUT ── */
#layout {
  flex:1; display:flex; overflow:hidden;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 260px; flex-shrink:0;
  background: var(--panel);
  border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  overflow-y:auto; z-index:10;
}
#sidebar::-webkit-scrollbar { width:3px; }
#sidebar::-webkit-scrollbar-thumb { background:rgba(39,174,96,0.3); }

.sidebar-section {
  padding:0.8rem 1rem;
  border-bottom:1px solid rgba(39,174,96,0.1);
}
.sidebar-title {
  font-family:'Cinzel',serif; font-size:0.65rem;
  letter-spacing:0.12em; color:rgba(39,174,96,0.55);
  text-transform:uppercase; margin-bottom:0.7rem;
}

/* Player cards */
.player-card {
  background:rgba(0,0,0,0.3);
  border:1px solid rgba(255,255,255,0.06);
  border-radius:10px; padding:0.6rem 0.7rem;
  margin-bottom:0.5rem; cursor:pointer;
  transition:all 0.15s;
}
.player-card:hover { border-color:rgba(39,174,96,0.35); background:rgba(39,174,96,0.05); }
.player-card.selected { border-color:#27ae60; background:rgba(39,174,96,0.08); }

.pc-header { display:flex; align-items:center; gap:0.5rem; margin-bottom:0.4rem; }
.pc-avatar { font-size:1.1rem; }
.pc-name { font-family:'Cinzel',serif; font-size:0.75rem; color:var(--gold-light); }
.pc-class { font-size:0.72rem; color:rgba(245,230,200,0.4); font-style:italic; }

.pc-hp-row {
  display:flex; align-items:center; gap:0.4rem;
  font-family:'Cinzel',serif; font-size:0.72rem;
  color:#e05555; margin-bottom:0.4rem;
}
.pc-hp-input {
  width:38px; background:rgba(0,0,0,0.4);
  border:none; border-bottom:1px solid #e05555;
  color:#e05555; font-family:'Cinzel',serif;
  font-size:0.72rem; text-align:center; outline:none;
}
.pc-hp-sep { color:rgba(245,230,200,0.3); }

.pc-stats-mini {
  display:flex; flex-wrap:wrap; gap:3px;
}
.pc-stat-dot {
  width:22px; height:22px; border-radius:4px;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cinzel',serif; font-size:0.55rem; font-weight:700;
  cursor:pointer; transition:transform 0.1s;
  color:rgba(0,0,0,0.85);
  title: '';
}
.pc-stat-dot:hover { transform:scale(1.15); }
.pc-stat-dot:active { transform:scale(0.92); }

.btn-view-sheet {
  width:100%; margin-top:0.4rem;
  background:rgba(201,168,76,0.07);
  border:1px solid rgba(201,168,76,0.2);
  border-radius:6px; padding:0.3rem;
  color:var(--gold); font-family:'Cinzel',serif;
  font-size:0.6rem; letter-spacing:0.06em;
  cursor:pointer; text-decoration:none;
  display:block; text-align:center;
  transition:background 0.15s;
}
.btn-view-sheet:hover { background:rgba(201,168,76,0.15); }

/* ── BOARD ── */
#boardArea {
  flex:1; position:relative; overflow:hidden;
  display:flex; flex-direction:column;
}

#boardWrapper {
  flex:1; position:relative; overflow:hidden;
}
#boardImg {
  width:100%; height:100%;
  object-fit:cover;
  background:linear-gradient(135deg,#0e1a0e,#080906);
}

/* Floating dice (same as game.html) */
.die-wrapper {
  position:absolute; z-index:10;
  pointer-events:none;
  display:flex; flex-direction:column; align-items:center;
}
.die-hex {
  position:relative; width:52px; height:52px;
  display:flex; align-items:center; justify-content:center;
}
.die-hex svg.hex-bg {
  position:absolute; inset:0; width:100%; height:100%;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.7));
}
.die-hex .die-val {
  position:relative; z-index:2;
  font-family:'Cinzel',serif; font-size:1.05rem;
  font-weight:700; line-height:1;
}
.die-hex.secret svg.hex-bg {
  filter:drop-shadow(0 0 10px rgba(39,174,96,0.7)) drop-shadow(0 4px 8px rgba(0,0,0,0.7));
}
.die-owner-lbl {
  font-size:0.46rem; font-family:'Cinzel',serif;
  color:rgba(255,255,255,0.65); text-shadow:0 1px 3px #000;
  margin-top:2px; white-space:nowrap;
}

@keyframes dieFly {
  0%   { opacity:0; transform:translate(var(--dx),var(--dy)) scale(0.3) rotate(-180deg); }
  40%  { opacity:1; transform:translate(calc(var(--dx)*0.1),calc(var(--dy)*0.1)) scale(1.15) rotate(320deg); }
  65%  { transform:translate(0,-12px) scale(0.92) rotate(355deg); }
  82%  { transform:translate(0,6px) scale(1.04) rotate(360deg); }
  100% { opacity:1; transform:translate(0,0) scale(1) rotate(360deg); }
}
.die-wrapper.flying .die-hex {
  animation:dieFly 0.95s cubic-bezier(0.22,1,0.36,1) both;
}

/* ── GM HUD ── */
#gmHud {
  height: var(--hud-h);
  background:var(--panel);
  border-top:1px solid var(--border);
  flex-shrink:0;
  display:flex; align-items:center;
  gap:0.5rem; padding:0 1rem;
  overflow-x:auto; overflow-y:hidden;
  z-index:20;
}
#gmHud::-webkit-scrollbar { height:3px; }
#gmHud::-webkit-scrollbar-thumb { background:rgba(39,174,96,0.3); }

/* Dice type buttons */
.dice-group {
  display:flex; flex-direction:column;
  align-items:center; gap:0.3rem; flex-shrink:0;
}
.dice-group-label {
  font-family:'Cinzel',serif; font-size:0.55rem;
  letter-spacing:0.08em; color:rgba(39,174,96,0.5);
  text-transform:uppercase;
}
.dice-row { display:flex; gap:0.35rem; }

.die-btn {
  width:46px; height:46px;
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(39,174,96,0.25);
  border-radius:10px;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.15s;
  color:#27ae60;
  font-family:'Cinzel',serif;
  position:relative; overflow:hidden;
}
.die-btn::before {
  content:''; position:absolute; inset:0;
  background:#27ae60; opacity:0.07;
  transition:opacity 0.15s;
}
.die-btn:hover::before { opacity:0.18; }
.die-btn:hover { border-color:#27ae60; transform:translateY(-2px); }
.die-btn:active { transform:scale(0.93); }
.die-btn .db-sides { font-size:0.75rem; font-weight:700; }
.die-btn .db-qty {
  font-size:0.52rem; color:rgba(39,174,96,0.6);
  margin-top:1px;
}

/* Qty badge on die btn */
.die-btn .qty-badge {
  position:absolute; top:3px; right:3px;
  background:#27ae60; color:#000;
  font-size:0.5rem; font-family:'Cinzel',serif;
  border-radius:20px; padding:0 4px;
  display:none;
}
.die-btn.has-qty .qty-badge { display:block; }

.hud-sep { width:1px; height:70px; background:var(--border); flex-shrink:0; }

.btn-gm-roll {
  flex-shrink:0; display:flex; flex-direction:column;
  align-items:center; gap:0.3rem;
  background:rgba(39,174,96,0.15);
  border:1px solid rgba(39,174,96,0.4);
  border-radius:12px; padding:0.55rem 1rem;
  cursor:pointer; transition:all 0.16s;
  color:#27ae60; font-family:'Cinzel',serif;
  font-size:0.62rem; letter-spacing:0.05em;
  text-transform:uppercase; min-width:72px;
}
.btn-gm-roll:hover { background:rgba(39,174,96,0.28); transform:translateY(-2px); }
.btn-gm-roll .icon { font-size:1.3rem; }

.btn-gm-clear {
  flex-shrink:0; display:flex; flex-direction:column;
  align-items:center; gap:0.3rem;
  background:rgba(139,26,26,0.15);
  border:1px solid rgba(139,26,26,0.35);
  border-radius:12px; padding:0.55rem 1rem;
  cursor:pointer; transition:all 0.16s;
  color:#e05555; font-family:'Cinzel',serif;
  font-size:0.62rem; letter-spacing:0.05em;
  text-transform:uppercase; min-width:72px;
}
.btn-gm-clear:hover { background:rgba(139,26,26,0.3); transform:translateY(-2px); }
.btn-gm-clear .icon { font-size:1.3rem; }

/* Last result box */
#gmRollResult {
  flex-shrink:0; min-width:110px; max-width:140px;
  text-align:center; padding:0 0.5rem;
  line-height:1.4;
}

/* Login guard */
#gmGuard {
  position:fixed; inset:0;
  background:rgba(0,0,0,0.97);
  display:flex; align-items:center; justify-content:center;
  z-index:999; flex-direction:column; gap:1rem;
  font-family:'Cinzel Decorative',serif;
  font-size:1.1rem; color:#27ae60; text-align:center;
}
</style>
</head>
<body>

<div id="gmGuard">
  <div>🎭</div>
  <div>Accès réservé au Maître de Jeu.</div>
  <a href="index.html" style="font-size:0.85rem;color:var(--gold-light);font-family:'Crimson Text',serif;font-style:italic">→ Se connecter</a>
</div>

<!-- TOP BAR -->
<div id="topBar">
  <div class="gm-title">🎭 Tableau de Bord MJ</div>
  <div class="gm-badge">Plateau Privé</div>
  <div class="top-sep"></div>
  <a class="btn-top" href="game.html">⚔️ Plateau principal</a>
  <a class="btn-top" href="sheet.html" onclick="sessionStorage.setItem('sheetCharId','')">📋 Fiches</a>
</div>

<!-- LAYOUT -->
<div id="layout">

  <!-- SIDEBAR: joueurs -->
  <div id="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-title">Joueurs connectés</div>
      <div id="playerList"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Image du plateau</div>
      <input id="imgUrlInput" type="text" placeholder="URL de l'image…"
        style="width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(39,174,96,0.25);border-radius:6px;padding:0.4rem 0.6rem;color:var(--parchment);font-family:'Crimson Text',serif;font-size:0.85rem;outline:none;margin-bottom:0.5rem">
      <button onclick="setImage()"
        style="width:100%;background:rgba(39,174,96,0.1);border:1px solid rgba(39,174,96,0.3);border-radius:6px;padding:0.35rem;color:#27ae60;font-family:'Cinzel',serif;font-size:0.65rem;letter-spacing:0.06em;cursor:pointer">
        🖼️ Changer l'image
      </button>
    </div>
    <div class="sidebar-section" style="font-size:0.78rem;color:rgba(245,230,200,0.35);font-style:italic;line-height:1.5">
      Clique sur une stat colorée<br>d'un joueur pour lancer<br>son dé secrètement.
    </div>
  </div>

  <!-- BOARD + HUD -->
  <div id="boardArea">
    <div id="boardWrapper">
      <img id="boardImg" src="" alt="plateau MJ">
      <!-- dés privés injectés ici -->
    </div>

    <!-- GM HUD -->
    <div id="gmHud">

      <!-- Dice type selector -->
      <div class="dice-group">
        <div class="dice-group-label">Dés secrets</div>
        <div class="dice-row" id="diceRow"></div>
      </div>

      <div class="hud-sep"></div>

      <!-- Roll + Clear -->
      <button class="btn-gm-roll" onclick="rollGM()">
        <div class="icon">🎲</div>
        <div>Lancer</div>
      </button>
      <button class="btn-gm-clear" onclick="clearGMDice()">
        <div class="icon">🧹</div>
        <div>Effacer</div>
      </button>

      <div class="hud-sep"></div>

      <!-- Result -->
      <div id="gmRollResult" style="color:rgba(245,230,200,0.35);font-style:italic;font-size:0.82rem">
        Lance un dé…
      </div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp }                    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { FIREBASE_CONFIG }                  from "./config.js";

// ── Session guard ─────────────────────────────────────────────
const isGM = sessionStorage.getItem('isGM') === 'true';
if (isGM) document.getElementById('gmGuard').style.display = 'none';

let CHARACTERS = JSON.parse(sessionStorage.getItem('characters') || '[]');
const STAT_COLORS = JSON.parse(sessionStorage.getItem('statColors') || '{}');

// ── Firebase ──────────────────────────────────────────────────
const app  = initializeApp(FIREBASE_CONFIG);
const fbDB = getDatabase(app);

// ── Dice state ────────────────────────────────────────────────
const GM_DICE_TYPES = [4, 6, 8, 10, 12, 20, 100];
let gmDiceQty = {}; // { sides: qty }
GM_DICE_TYPES.forEach(s => gmDiceQty[s] = 0);
let gmDiceOnBoard = {};

// ── Build dice row ────────────────────────────────────────────
function buildDiceRow() {
  const row = document.getElementById('diceRow');
  row.innerHTML = '';
  GM_DICE_TYPES.forEach(sides => {
    const btn = document.createElement('div');
    btn.className = 'die-btn';
    btn.id = `dieBtn_${sides}`;
    btn.innerHTML = `
      <span class="db-sides">D${sides}</span>
      <span class="qty-badge" id="qtyBadge_${sides}">0</span>
    `;
    btn.addEventListener('click', () => {
      gmDiceQty[sides] = (gmDiceQty[sides] % 10) + 1;
      updateDiceBtn(sides);
    });
    btn.addEventListener('contextmenu', e => {
      e.preventDefault();
      gmDiceQty[sides] = Math.max(0, gmDiceQty[sides] - 1);
      updateDiceBtn(sides);
    });
    row.appendChild(btn);
  });
}

function updateDiceBtn(sides) {
  const qty = gmDiceQty[sides];
  const badge = document.getElementById(`qtyBadge_${sides}`);
  const btn   = document.getElementById(`dieBtn_${sides}`);
  badge.textContent = qty;
  btn.classList.toggle('has-qty', qty > 0);
}

// ── Roll GM dice (private, not synced to players) ─────────────
function rollGMDice(sides, color = '#27ae60', label = null) {
  const value = Math.floor(Math.random() * sides) + 1;
  const dieId = `gm_${Date.now()}_${Math.random().toString(36).slice(2,5)}`;
  const board = document.getElementById('boardWrapper');
  const bw = board.clientWidth, bh = board.clientHeight;
  const margin = 70;
  const x = margin + Math.random() * (bw - margin * 2);
  const y = margin + Math.random() * (bh - margin * 2);

  const dieData = { id: dieId, x, y, value, sides, color, label: label || `D${sides}`, owner: 'MJ', ts: Date.now() };
  gmDiceOnBoard[dieId] = dieData;
  renderGMDie(dieData, true);
  return { value, sides };
}

function rollGM() {
  const active = GM_DICE_TYPES.filter(s => gmDiceQty[s] > 0);
  if (!active.length) { alert('Cliquez sur les dés pour en sélectionner.'); return; }

  let results = [];
  let total = 0;
  active.forEach(sides => {
    for (let i = 0; i < gmDiceQty[sides]; i++) {
      const { value } = rollGMDice(sides);
      results.push(`D${sides}:${value}`);
      total += value;
    }
  });

  const res = document.getElementById('gmRollResult');
  res.innerHTML = `
    <span style="font-size:0.7rem;color:rgba(39,174,96,0.6);font-family:'Cinzel',serif">${results.join(' ')}</span><br>
    <span style="font-size:1.4rem;color:#27ae60;font-family:'Cinzel',serif">${total}</span>
  `;
}

// Roll a specific stat die for a player (secretly)
window.rollStatForPlayer = function(charId, statKey, statVal, color, label) {
  const value = Math.floor(Math.random() * 20) + 1;
  const dieId = `gm_stat_${Date.now()}`;
  const board = document.getElementById('boardWrapper');
  const bw = board.clientWidth, bh = board.clientHeight;
  const margin = 70;
  const x = margin + Math.random() * (bw - margin * 2);
  const y = margin + Math.random() * (bh - margin * 2);

  const success = value <= statVal;
  const dieData = { id: dieId, x, y, value, sides: 20, color, label, owner: 'MJ', success, ts: Date.now() };
  gmDiceOnBoard[dieId] = dieData;
  renderGMDie(dieData, true);

  const char = CHARACTERS.find(c => c.id === charId);
  const res = document.getElementById('gmRollResult');
  res.innerHTML = `
    <span style="font-size:0.7rem;color:${color};font-family:'Cinzel',serif">${char?.name?.split(' ')[0]} — ${label}</span><br>
    <span style="font-size:1.4rem;color:${success?'#f0d080':'#e05555'};font-family:'Cinzel',serif">${value}</span><br>
    <span style="font-size:0.65rem;color:${success?'#f0d080':'#e05555'}">${success?'✦ Réussi':'✗ Échec'} (/${statVal})</span>
  `;
};

function clearGMDice() {
  gmDiceOnBoard = {};
  document.querySelectorAll('.die-wrapper').forEach(el => el.remove());
  document.getElementById('gmRollResult').innerHTML = `<span style="color:rgba(245,230,200,0.35);font-style:italic;font-size:0.82rem">Lance un dé…</span>`;
}

// ── Render GM die ─────────────────────────────────────────────
function hexSVG(fill, stroke) {
  return `<svg class="hex-bg" viewBox="0 0 54 62" xmlns="http://www.w3.org/2000/svg">
    <polygon points="27,2 52,15.5 52,46.5 27,60 2,46.5 2,15.5" fill="${fill}" opacity="0.9"/>
    <polygon points="27,2 52,15.5 52,46.5 27,60 2,46.5 2,15.5" fill="none" stroke="${stroke}" stroke-width="2.5"/>
  </svg>`;
}

function getContrast(hex) {
  if (!hex || hex[0]!=='#') return '#000';
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)>145?'#111':'#fff';
}

function renderGMDie(die, animate=false) {
  const old = document.getElementById(die.id);
  if (old) old.remove();

  const strokeColor = die.success === false ? 'rgba(230,60,60,0.9)'
                    : die.success === true  ? 'rgba(255,220,60,0.9)'
                    : 'rgba(39,174,96,0.9)';

  const wrapper = document.createElement('div');
  wrapper.className = 'die-wrapper';
  wrapper.id = die.id;
  wrapper.style.cssText = `left:${die.x}px;top:${die.y}px;transform:translate(-50%,-50%)`;

  const hex = document.createElement('div');
  hex.className = 'die-hex secret';
  hex.innerHTML = `${hexSVG(die.color, strokeColor)}<span class="die-val" style="color:${getContrast(die.color)}">${die.value}</span>`;

  const lbl = document.createElement('div');
  lbl.className = 'die-owner-lbl';
  lbl.textContent = die.label;

  wrapper.appendChild(hex);
  wrapper.appendChild(lbl);

  if (animate) {
    document.getElementById('boardWrapper').appendChild(wrapper);
    const bw = document.getElementById('boardWrapper').clientWidth;
    const bh = document.getElementById('boardWrapper').clientHeight;
    hex.style.setProperty('--dx', (bw/2 - die.x) + 'px');
    hex.style.setProperty('--dy', (bh + 75 - die.y) + 'px');
    void wrapper.offsetWidth;
    wrapper.classList.add('flying');
    wrapper.addEventListener('animationend', () => wrapper.classList.remove('flying'), { once:true });
  } else {
    document.getElementById('boardWrapper').appendChild(wrapper);
  }
}

// ── Build player list in sidebar ──────────────────────────────
function buildPlayerList() {
  const list = document.getElementById('playerList');
  list.innerHTML = '';

  CHARACTERS.forEach(char => {
    const card = document.createElement('div');
    card.className = 'player-card';
    card.id = `pc_${char.id}`;

    // Stats mini dots
    const statDots = Object.entries(char.stats).map(([key, val]) => {
      const sc = STAT_COLORS[key] || { color:'#aaa', label:key };
      return `<div class="pc-stat-dot" style="background:${sc.color}" title="${sc.label}: ${val}"
                   onclick="rollStatForPlayer('${char.id}','${key}',${val},'${sc.color}','${sc.label}')">${val}</div>`;
    }).join('');

    card.innerHTML = `
      <div class="pc-header">
        <span class="pc-avatar">${char.avatar}</span>
        <div>
          <div class="pc-name">${char.name}</div>
          <div class="pc-class">${char.class}</div>
        </div>
      </div>
      <div class="pc-hp-row">
        ♥
        <input class="pc-hp-input" type="number" min="0" max="999"
               value="${char.hp ?? char.hpMax ?? 0}" id="hp_${char.id}"
               onchange="updatePlayerHp('${char.id}', this.value)">
        <span class="pc-hp-sep">/</span>
        <input class="pc-hp-input" type="number" min="0" max="999"
               value="${char.hpMax ?? 0}" id="hpmax_${char.id}"
               onchange="updatePlayerHpMax('${char.id}', this.value)">
      </div>
      <div class="pc-stats-mini">${statDots}</div>
      <a class="btn-view-sheet" href="sheet.html"
         onclick="sessionStorage.setItem('sheetCharId','${char.id}')">📋 Fiche complète</a>
    `;
    list.appendChild(card);
  });
}

// ── HP update from sidebar ────────────────────────────────────
window.updatePlayerHp = function(charId, val) {
  const char = CHARACTERS.find(c => c.id === charId);
  if (!char) return;
  char.hp = parseInt(val);
  sessionStorage.setItem('characters', JSON.stringify(CHARACTERS));
  set(ref(fbDB, `session/hp/${charId}`), { current: char.hp, max: char.hpMax ?? char.hp });
};

window.updatePlayerHpMax = function(charId, val) {
  const char = CHARACTERS.find(c => c.id === charId);
  if (!char) return;
  char.hpMax = parseInt(val);
  sessionStorage.setItem('characters', JSON.stringify(CHARACTERS));
  set(ref(fbDB, `session/hp/${charId}`), { current: char.hp ?? char.hpMax, max: char.hpMax });
};

// ── Set board image for all players ──────────────────────────
window.setImage = function() {
  const url = document.getElementById('imgUrlInput').value.trim();
  if (!url) return;
  document.getElementById('boardImg').src = url;
  set(ref(fbDB, 'session/boardImage'), url);
};

// ── Sync HP from Firebase ─────────────────────────────────────
onValue(ref(fbDB, 'session/hp'), snap => {
  const data = snap.val() || {};
  Object.entries(data).forEach(([cid, hp]) => {
    const char = CHARACTERS.find(c => c.id === cid);
    if (char) { char.hp = hp.current; char.hpMax = hp.max; }
    const hpEl = document.getElementById(`hp_${cid}`);
    const hmEl = document.getElementById(`hpmax_${cid}`);
    if (hpEl) hpEl.value = hp.current;
    if (hmEl) hmEl.value = hp.max;
  });
});

// Sync board image
onValue(ref(fbDB, 'session/boardImage'), snap => {
  const url = snap.val();
  if (url) {
    document.getElementById('boardImg').src = url;
    document.getElementById('imgUrlInput').value = url;
  }
});

// ── Init ──────────────────────────────────────────────────────
buildDiceRow();
buildPlayerList();
</script>
</body>
</html>
